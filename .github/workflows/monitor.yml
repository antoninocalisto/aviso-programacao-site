name: Verificar processo OTT
on:
  schedule:
    # Brasília (UTC-3): 06:00–21:30, mais a execução final às 22:00.
    - cron: '0,30 9-23 * * *'
    - cron: '0,30 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: monitor-ott
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar pela aplicação na Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          if (!process.env.CRON_SECRET) throw new Error('CRON_SECRET não configurado');
          const response = await fetch('https://aviso-programacao-site.vercel.app/api/monitor', {
            headers: { Authorization: `Bearer ${process.env.CRON_SECRET}` },
            signal: AbortSignal.timeout(70000)
          });
          if (!response.ok) throw new Error(`Verificação falhou: HTTP ${response.status}`);
          console.log(await response.text());
          JS
